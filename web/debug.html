<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claims Agent Console</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #98a2b3; --accent: #6ea8fe;
    --ok: #3ddc97; --warn: #f5b84b; --bad: #ff6b6b; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .spacer { flex: 1; }
  .chip { font: 12px var(--mono); padding: 3px 9px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--muted); background: var(--panel-2); }
  a.chip { text-decoration: none; }
  a.chip:hover { color: var(--accent); border-color: var(--accent); }
  .chip.ok { color: var(--ok); border-color: #2a4c3e; }
  .chip.bad { color: var(--bad); border-color: #4c2a2a; }
  main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 56px); }
  aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  .call { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .call:hover { background: var(--panel-2); }
  .call.active { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .call .id { font: 12px var(--mono); color: var(--accent); }
  .call .who { font-weight: 600; margin-top: 2px; }
  .call .meta { color: var(--muted); font-size: 12px; }
  section { padding: 20px; overflow-y: auto; }
  .state { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-family: var(--mono);
          background: var(--panel-2); border: 1px solid var(--line); }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .card .v { margin-top: 3px; font-family: var(--mono); font-size: 13px; word-break: break-word; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
       margin: 0 0 10px; }
  .event { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--ok);
           border-radius: 8px; margin-bottom: 8px; }
  .event.err { border-left-color: var(--bad); }
  .event summary { padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .event summary::marker { color: var(--muted); }
  .event .name { font-family: var(--mono); font-weight: 600; }
  .event .ms { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .event .tag { font-size: 11px; font-family: var(--mono); padding: 1px 7px; border-radius: 999px;
                background: var(--panel-2); border: 1px solid var(--line); }
  .event .tag.err { color: var(--bad); } .event .tag.ok { color: var(--ok); }
  pre { margin: 0; padding: 12px; background: #12141a; border-top: 1px solid var(--line);
        font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
        color: #c9d1e1; max-height: 340px; overflow: auto; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .card .v.ok { color: var(--ok); } .card .v.warn { color: var(--warn); } .card .v.bad { color: var(--bad); }
  .card .note { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .pending { color: var(--muted); font-size: 12px; font-family: var(--mono);
             background: var(--panel); border: 1px dashed var(--line); border-radius: 8px;
             padding: 12px; margin-bottom: 22px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { max-height: 200px; } }
</style>
</head>
<body>
<header>
  <h1>Claims Agent · live call console</h1>
  <span class="chip" id="health">checking…</span>
  <span class="chip" id="backend"></span>
  <div class="spacer"></div>
  <a class="chip" href="/call">browser dialler →</a>
  <span class="chip" id="tick">—</span>
</header>
<main>
  <aside id="calls"></aside>
  <section id="detail"><div class="empty">Start a call, then pick it on the left.</div></section>
</main>
<script>
const state = { selected: null, calls: [], open: new Set() };

const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const ago = s => s < 60 ? `${Math.round(s)}s ago` : `${Math.floor(s / 60)}m ago`;

async function poll() {
  try {
    const [health, calls] = await Promise.all([
      fetch("health").then(r => r.json()),
      fetch("debug/calls").then(r => r.json()),
    ]);
    const live = health.data_layer?.ok !== false;
    const hEl = document.getElementById("health");
    hEl.textContent = live ? "data layer ok" : "data layer DOWN";
    hEl.className = "chip " + (live ? "ok" : "bad");
    document.getElementById("backend").textContent = `backend: ${health.backend}`;
    document.getElementById("tick").textContent = new Date().toLocaleTimeString();
    state.calls = calls.calls || [];
    if (!state.selected && state.calls.length) state.selected = state.calls[0].call_id;
    renderList(); renderDetail();
  } catch (err) {
    const hEl = document.getElementById("health");
    hEl.textContent = "server unreachable"; hEl.className = "chip bad";
  }
}

function renderList() {
  const el = document.getElementById("calls");
  if (!state.calls.length) { el.innerHTML = '<div class="empty">no calls yet</div>'; return; }
  el.innerHTML = state.calls.map(c => `
    <div class="call ${c.call_id === state.selected ? "active" : ""}" data-id="${esc(c.call_id)}">
      <div class="id">${esc(c.call_id.slice(0, 18))}</div>
      <div class="who">${esc(c.customer || c.candidate || c.claimed_phone || "unidentified")}</div>
      <div class="meta">${c.tool_events.length} tools · ${esc(c.auth_outcome)} · ${ago(c.age_seconds)}</div>
    </div>`).join("");
  el.querySelectorAll(".call").forEach(node =>
    node.onclick = () => { state.selected = node.dataset.id; renderList(); renderDetail(); });
}

function pills(c) {
  const out = [];
  out.push(c.authenticated
    ? `<span class="pill ok">authenticated</span>`
    : `<span class="pill warn">not authenticated</span>`);
  out.push(`<span class="pill ${c.auth_outcome === "failed" ? "bad" : ""}">auth: ${esc(c.auth_outcome)}</span>`);
  out.push(`<span class="pill ${c.auth_attempts ? "warn" : ""}">failed attempts: ${c.auth_attempts}/${c.auth_attempts + c.attempts_remaining}</span>`);
  if (c.escalated) out.push(`<span class="pill bad">escalated: ${esc(c.escalation_reason)}</span>`);
  if (c.emergency) out.push(`<span class="pill bad">EMERGENCY</span>`);
  return out.join("");
}

// The number that matters on a voice call is the gap between the caller
// finishing a sentence and the agent starting to speak. It is computed from
// the end-of-call report, so it is absent until the call ends — say that,
// rather than leaving a blank where a measurement should be.
function latencyBlock(c) {
  const l = c.latency || {};
  if (!l.turns) {
    return `<h2>caller-perceived latency</h2>
      <div class="pending">waiting for the end-of-call report — this is measured from the
      finished transcript, so it lands a few seconds after the caller hangs up.</div>`;
  }
  const band = ms => ms < 2000 ? "ok" : ms < 3000 ? "warn" : "bad";
  const toolDelta = (l.with_tool_ms != null && l.without_tool_ms != null)
    ? l.with_tool_ms - l.without_tool_ms : null;
  const slowest = Math.max(0, ...(c.tool_events || []).map(e => e.duration_ms || 0));

  const cells = [
    ["turns measured", `${l.turns}`, "", ""],
    ["p50", `${l.p50_ms} ms`, band(l.p50_ms), "half of turns were faster than this"],
    ["p95", `${l.p95_ms} ms`, band(l.p95_ms), "small sample — treat as indicative"],
    ["slowest turn", `${l.max_ms} ms`, band(l.max_ms), "the one worth looking at"],
    ["turns with a tool", l.with_tool_ms != null ? `${l.with_tool_ms} ms` : "—", "", ""],
    ["turns without", l.without_tool_ms != null ? `${l.without_tool_ms} ms` : "—", "", ""],
  ];
  if (toolDelta !== null) {
    cells.push(["tool overhead", `${toolDelta >= 0 ? "+" : ""}${toolDelta} ms`,
      Math.abs(toolDelta) < 500 ? "ok" : "warn",
      `our slowest tool this call: ${Math.round(slowest)} ms — the rest is endpointing and TTS`]);
  }

  return `<h2>caller-perceived latency</h2><div class="grid">` + cells.map(
    ([k, v, cls, note]) => `<div class="card"><div class="k">${esc(k)}</div>
      <div class="v ${cls}">${esc(v)}</div>
      ${note ? `<div class="note">${esc(note)}</div>` : ""}</div>`).join("") + `</div>`;
}

function renderDetail() {
  const el = document.getElementById("detail");
  const c = state.calls.find(x => x.call_id === state.selected);
  if (!c) { el.innerHTML = '<div class="empty">Start a call, then pick it on the left.</div>'; return; }

  const cards = [
    ["call id", c.call_id],
    ["phone claimed", c.claimed_phone || "—"],
    ["verified customer", c.customer || "—"],
    ["matched account", c.candidate || "—"],
    ["intents", (c.intents || []).join(", ") || "—"],
    ["claims discussed", (c.claims_discussed || []).join(", ") || "—"],
    ["assistant path", (c.assistant_path || []).join(" → ") || "single assistant"],
    ["age", ago(c.age_seconds)],
  ].map(([k, v]) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");

  const events = (c.tool_events || []).map((e, i) => {
    const key = `${c.call_id}:${i}`;
    const bad = !!e.error;
    const override = e.result && e.result.safety_override ? ' <span class="tag err">safety override</span>' : "";
    return `<details class="event ${bad ? "err" : ""}" data-key="${esc(key)}" ${state.open.has(key) ? "open" : ""}>
      <summary>
        <span class="name">${esc(e.name)}</span>
        <span class="tag ${bad ? "err" : "ok"}">${bad ? esc(e.error) : "ok"}</span>
        <span class="ms">${e.duration_ms} ms</span>${override}
      </summary>
      <pre>args    ${esc(JSON.stringify(e.arguments, null, 2))}

result  ${esc(JSON.stringify(e.result, null, 2))}</pre>
    </details>`;
  }).join("") || '<div class="empty">no tool calls yet</div>';

  el.innerHTML = `<div class="state">${pills(c)}</div><div class="grid">${cards}</div>
    ${latencyBlock(c)}
    <h2>tool timeline (${(c.tool_events || []).length})</h2>${events}`;

  el.querySelectorAll("details").forEach(node => node.ontoggle = () => {
    node.open ? state.open.add(node.dataset.key) : state.open.delete(node.dataset.key);
  });
}

poll();
setInterval(poll, 1500);
</script>
</body>
</html>
