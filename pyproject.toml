[project]
name = "observe-claims-agent"
version = "1.0.0"
description = "VoiceAI claims support agent for Observe Insurance: tools, state, and integrations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "gspread>=6.1",
    "google-auth>=2.37",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
# pythonpath means `pytest` works from any directory, not just the repo root.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends/Header defaults are called in signatures
