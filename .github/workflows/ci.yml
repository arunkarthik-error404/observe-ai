name: CI

# Three layers get checked, because this project can break in three different
# ways: the Python can be wrong, the agent configuration can be wrong, and the
# knowledge base can be wrong while both of the others are fine. Only the first
# is what most people mean by "tests".
#
# Everything here runs without a single credential. That is a property of the
# design, not a convenience: the repository pattern means the suite runs against
# the in-memory backend, and the Salesforce adapter is tested through a mock
# transport. No org, no spreadsheet, no secrets in GitHub.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point paying for a stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.12 is what Render runs,
        # so that row is the one that mirrors production.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest
        run: pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6
      # Rules are in pyproject. `ruff format` is deliberately not run: the
      # comment alignment in this codebase is load-bearing for readability and
      # the formatter would flatten it.
      - name: ruff check
        run: ruff check .

  agent-config:
    name: agent config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Catches the class of bug the test suite cannot see: a tool the model can
      # call that the server does not implement, a squad destination pointing
      # nowhere, an unresolved prompt include. Provisioning a broken config
      # succeeds — you find out on a live call.
      - name: validate vapi/agents.json and the prompts
        run: python scripts/check_agent_config.py
      # Renders every payload through the real provisioning path without
      # calling Vapi, so a malformed tool schema fails here rather than at
      # provision time. The values are placeholders; no credential is needed
      # to prove the payloads build.
      - name: render the provisioning payloads
        env:
          SERVER_URL: https://ci.invalid
          VAPI_SECRET: ci-placeholder
        run: |
          python scripts/provision_vapi.py --mode squad --dry-run > /dev/null
          python scripts/provision_vapi.py --mode single --dry-run > /dev/null

  knowledge-base:
    name: knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Retrieval is tuned by a single threshold, so a change to faq.md or
      # MIN_SCORE can silently start answering questions it should refuse.
      # Both directions are fixtures: what must be answered, what must not.
      - name: recall and refusal fixtures
        run: python scripts/check_kb.py

  secrets:
    name: no credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .gitignore is the intent; this is the enforcement. A service-account key
      # or a .env in the history is not something you can take back by deleting
      # the file in the next commit.
      - name: check tracked files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)(\.env$|\.env\.[^e]|secrets/|service-account.*\.json$)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::credential files are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "no credential files tracked"
      - name: scan content for key material
        run: |
          hits=$(git grep -nIE '(BEGIN [A-Z ]*PRIVATE KEY|hooks\.slack\.com/services/T|sk-[A-Za-z0-9]{32})' \
                 -- ':!*.lock' ':!.github/workflows/*' || true)
          if [ -n "$hits" ]; then
            echo "::error::possible secret in tracked content:"
            echo "$hits"
            exit 1
          fi
          echo "no key material found"
