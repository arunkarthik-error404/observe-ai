# Render blueprint. Secrets are never in this file: everything marked
# `sync: false` is entered once in the Render dashboard and stays there.
services:
  - type: web
    name: observe-claims-agent
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Google Sheets is the system of record in a deployed environment.
      - key: BACKEND
        value: sheets
      # The whole service-account key, on one line. On Render this is the only
      # practical option — there is no file to point at.
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: SHEET_ID
        sync: false

      # Reject any webhook that cannot prove it came from Vapi.
      - key: REQUIRE_SECRET
        value: "true"
      - key: VAPI_SECRET
        sync: false

      # Used only by the browser dialler at /call. The public key is safe to
      # expose; it can start calls and nothing else.
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_SQUAD_ID
        sync: false

      # auto | open | closed — pin it to demo either escalation branch.
      - key: BUSINESS_HOURS_MODE
        value: auto
      # Leave unset unless a real PSTN destination exists; without one the
      # agent correctly offers a callback instead of promising a transfer.
      - key: TRANSFER_PHONE_NUMBER
        sync: false
